<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>meeMail — Secure messaging for meeians</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024' fill='none'><rect width='1024' height='1024' rx='220' fill='%232563EB'/><rect x='192' y='280' width='640' height='460' rx='64' fill='white'/><path d='M224 328L512 548L800 328' stroke='%232563EB' stroke-width='34' stroke-linecap='round' stroke-linejoin='round'/><path d='M224 692L430 500' stroke='%232563EB' stroke-width='28' stroke-linecap='round'/><path d='M800 692L594 500' stroke='%232563EB' stroke-width='28' stroke-linecap='round'/><circle cx='460' cy='410' r='14' fill='%232563EB'/><circle cx='564' cy='410' r='14' fill='%232563EB'/></svg>">
  <link rel="manifest" href="/Official/meeMail/manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/Official/meeMail/sw.js');
    }
  </script>
</head>
<body>
  <!-- অথেন্টিকেশন কন্টেইনার -->
  <div id="auth-container">
    <div class="auth-box">
      <div class="auth-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" fill="none" style="width: 260px; height: auto; margin-bottom: 2rem;">
          <defs>
            <style>
              .brand{font-family: Inter, "SF Pro Display", Poppins, Arial, sans-serif; font-size: 64px; font-weight: 800; letter-spacing: -3px;}
            </style>
          </defs>
          <text x="12" y="64" class="brand" fill="#0F172A">m</text>
          <text x="72" y="64" class="brand" fill="#2563EB">e</text>
          <text x="112" y="64" class="brand" fill="#2563EB">e</text>
          <circle cx="95" cy="20" r="3.5" fill="#2563EB"/>
          <circle cx="135" cy="20" r="3.5" fill="#2563EB"/>
          <text x="145" y="64" class="brand" fill="#0F172A">Mail</text>
        </svg>
      </div>
      <div class="auth-tabs">
        <button id="tab-login" class="tab active">Login</button>
        <button id="tab-register" class="tab">Register</button>
      </div>

      <form id="login-form" class="auth-form active">
        <div class="form-group">
          <label for="login-username">mee Address</label>
          <input type="text" id="login-username" placeholder="yourname" required>
          <div class="form-hint">@mee.com</div>
        </div>
        <div class="form-group password-field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
          <i class="ri-eye-off-line password-toggle"></i>
        </div>
        <button type="submit" class="btn-primary btn-full">Sign In</button>
        <p id="login-message" class="modal-message"></p>
      </form>

      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="reg-username">Choose your mee Address</label>
          <input type="text" id="reg-username" placeholder="yourname" required>
          <div class="form-hint">Only lowercase letters, digits, dots (.) and hyphens (-)</div>
          <p id="username-status" class="check-status"></p>
        </div>
        <div class="form-group password-field">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" placeholder="At least 6 characters" required>
          <i class="ri-eye-off-line password-toggle"></i>
        </div>
        <div class="form-group password-field">
          <label for="reg-confirm">Confirm Password</label>
          <input type="password" id="reg-confirm" placeholder="Re-enter password" required>
          <i class="ri-eye-off-line password-toggle"></i>
        </div>
        <button type="submit" class="btn-primary btn-full" id="register-submit-btn" disabled>Create Address</button>
        <p id="register-message" class="modal-message"></p>
      </form>
    </div>
  </div>

  <!-- অ্যাপ কন্টেইনার -->
  <div id="app-container" style="display: none;">
    <header class="app-header">
      <div class="header-left">
        <button id="menu-toggle" class="icon-btn"><i class="ri-menu-line"></i></button>
        <div class="app-logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" fill="none" style="height: 40px;">
            <defs>
              <style>
                .brand{font-family: Inter, "SF Pro Display", Poppins, Arial, sans-serif; font-size: 64px; font-weight: 800; letter-spacing: -3px;}
              </style>
            </defs>
            <text x="12" y="64" class="brand" fill="#FFFFFF">m</text>
            <text x="72" y="64" class="brand" fill="#2563EB">e</text>
            <text x="112" y="64" class="brand" fill="#2563EB">e</text>
            <circle cx="95" cy="20" r="3.5" fill="#2563EB"/>
            <circle cx="135" cy="20" r="3.5" fill="#2563EB"/>
            <text x="145" y="64" class="brand" fill="#FFFFFF">Mail</text>
          </svg>
        </div>
      </div>
      <div class="header-right">
        <button id="compose-btn" class="btn-primary"><i class="ri-pencil-line"></i> Compose</button>
        <div class="user-menu">
          <button id="user-btn" class="icon-btn"><i class="ri-user-3-line"></i></button>
          <div id="user-dropdown" class="dropdown-menu">
            <span id="current-address"></span>
            <button id="logout-btn" class="btn-outline btn-small">Logout</button>
          </div>
        </div>
      </div>
    </header>

    <aside id="sidebar" class="sidebar">
      <nav>
        <ul>
          <li><a href="#" class="sidebar-link active" data-section="inbox"><i class="ri-inbox-line"></i> Inbox</a></li>
          <li><a href="#" class="sidebar-link" data-section="sent"><i class="ri-send-plane-line"></i> Sent</a></li>
          <li><a href="#" class="sidebar-link" data-section="drafts"><i class="ri-draft-line"></i> Drafts</a></li>
          <li><a href="#" class="sidebar-link" data-section="contacts"><i class="ri-contacts-book-line"></i> Contacts</a></li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <section id="section-inbox" class="content-section active">
        <h2 class="section-heading">Inbox</h2>
        <div id="inbox-list" class="message-list"></div>
      </section>

      <section id="section-sent" class="content-section">
        <h2 class="section-heading">Sent</h2>
        <div id="sent-list" class="message-list"></div>
      </section>

      <section id="section-drafts" class="content-section">
        <h2 class="section-heading">Drafts</h2>
        <p class="section-text">No drafts yet.</p>
      </section>

      <section id="section-contacts" class="content-section">
        <h2 class="section-heading">Contacts</h2>
        <p class="section-text">Your contacts will appear here.</p>
      </section>

      <section id="section-message-view" class="content-section">
        <button id="back-btn" class="btn-outline"><i class="ri-arrow-left-line"></i> Back</button>
        <div id="message-detail"></div>
      </section>
    </main>
  </div>

  <div id="compose-modal" class="modal">
    <div class="modal-content compose-modal-content">
      <span class="modal-close">&times;</span>
      <h2 class="modal-title">New Message</h2>
      <form id="compose-form">
        <div class="form-group">
          <label for="compose-to">To</label>
          <input type="text" id="compose-to" placeholder="username@mee.com" required>
        </div>
        <div class="form-group">
          <label for="compose-subject">Subject</label>
          <input type="text" id="compose-subject" placeholder="Subject" required>
        </div>
        <div class="form-group">
          <label for="compose-body">Message</label>
          <textarea id="compose-body" rows="10" placeholder="Write your message..." required></textarea>
        </div>
        <button type="submit" class="btn-primary btn-full">Send</button>
        <p id="compose-message" class="modal-message"></p>
      </form>
    </div>
  </div>

  <div id="popup" class="popup">
    <p id="popup-message"></p>
    <button id="popup-close" class="btn-primary btn-small">OK</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
