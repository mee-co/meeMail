<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verified — mee</title>
  <style>
    body { font-family: Montserrat, sans-serif; background: #f0f4ff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .msg { text-align: center; background: white; padding: 3rem; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    h2 { color: #0F172A; }
    p { color: #475569; }
  </style>
</head>
<body>
  <div class="msg">
    <h2>Email verified successfully!</h2>
    <p>Redirecting to create your mee address...</p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (token) {
      // Redirect to backend verify endpoint, which will send back token + email
      const backendUrl = 'https://backend-y7gm.onrender.com';// will replace after deploy
      window.location.href = `${backendUrl}/api/auth/verify?token=${token}`;
    } else {
      document.querySelector('.msg').innerHTML = '<h2>Invalid link</h2>';
    }
  </script>
</body>
</html>
